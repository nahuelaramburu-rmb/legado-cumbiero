services:
  legado-cumbiero:
    build: .
    container_name: legado-cumbiero
    restart: unless-stopped
    depends_on:
      - legado-api
    environment:
      - NODE_ENV=production
      # Login/roles: esta app le habla a legado-api por la red interna de
      # Docker (nunca por internet) y verifica los JWT que esa API emite —
      # necesita el mismo secret. Ver api/README.md "Flujo de auth".
      - API_INTERNAL_URL=http://legado-api:3000/api/v1
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      # Si tu VPS usa el patrón nginx-proxy + acme-companion (nginx-proxy /
      # letsencrypt-nginx-proxy-companion), descomentá estas 4 líneas y
      # conectá este servicio a la red de ese proxy (ver networks abajo):
      # - VIRTUAL_HOST=legadocumbiero.rmbcorp.com
      # - VIRTUAL_PORT=3000
      # - LETSENCRYPT_HOST=legadocumbiero.rmbcorp.com
      # - LETSENCRYPT_EMAIL=admin@rmbcorp.com
    volumes:
      - legado-cumbiero-data:/app/data
    # Si tu nginx NO es del patrón nginx-proxy (por ejemplo nginx directo en
    # el host, o un nginx dockerizado con conf.d montado a mano), exponé el
    # puerto acá y apuntá el server block de nginx a 127.0.0.1:3050:
    # ports:
    #   - "127.0.0.1:3050:3000"
    networks:
      - default
      # - nginx-proxy   # descomentar y poner el nombre real de la red compartida

  # --- Nuevo backend (auth/roles + todos los datos) — ver api/README.md ---

  postgres:
    image: postgres:16-alpine
    container_name: legado-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - legado-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  legado-api:
    build: ./api
    container_name: legado-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - CORS_ORIGIN=${API_CORS_ORIGIN:-https://legadocumbiero.rmbcorp.com}
      - PORT=3000
    ports:
      - "127.0.0.1:3051:3000"
    networks:
      - default

volumes:
  legado-cumbiero-data:
  legado-postgres-data:

networks:
  default: {}
  # nginx-proxy:
  #   external: true
